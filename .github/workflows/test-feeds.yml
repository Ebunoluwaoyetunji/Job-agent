name: Test feeds (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Is the HotNigerianJobs feed behind the website?
        run: |
          python - <<'PY'
          import re, requests, feedparser, job_agent as ja
          H = ja.BROWSER_HEADERS
          f = feedparser.parse(requests.get("https://www.hotnigerianjobs.com/feed/rss.xml", headers=H, timeout=30).content)
          feed_ids = [int(m) for e in f.entries for m in re.findall(r"/hotjobs/(\d+)/", e.link)]
          print("feed: newest id", max(feed_ids), "oldest id", min(feed_ids))
          print("feed: first 3 dates", [e.get("published") for e in f.entries[:3]])
          print("feed: last 3 dates", [e.get("published") for e in f.entries[-3:]])
          for url in ["https://www.hotnigerianjobs.com/", "https://www.hotnigerianjobs.com/jobs/"]:
              try:
                  r = requests.get(url, headers=H, timeout=30)
                  ids = [int(x) for x in re.findall(r"/hotjobs/(\d+)/", r.text)]
                  dates = re.findall(r"(\d{1,2}(?:st|nd|rd|th)? (?:Sep|September)[a-z]*,? 2026)", r.text)[:5]
                  print(url, r.status_code, "newest id on site:", max(ids) if ids else None, "| dates seen:", dates)
              except Exception as ex:
                  print(url, "ERROR", ex)
          for url in ["https://www.hotnigerianjobs.com/feed/rss.xml?nocache=1", "https://www.hotnigerianjobs.com/feed/"]:
              try:
                  r = requests.get(url, headers=H, timeout=30)
                  f2 = feedparser.parse(r.content)
                  ids2 = [int(m) for e in f2.entries for m in re.findall(r"/hotjobs/(\d+)/", e.link)]
                  print(url, r.status_code, len(f2.entries), "newest id:", max(ids2) if ids2 else None)
              except Exception as ex:
                  print(url, "ERROR", ex)
          PY
